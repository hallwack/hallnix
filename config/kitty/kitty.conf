# FONTS
# For Laptop display
font_family      IosevkaTermNF-Semibold
bold_font        IosevkaTermNF-Bold
italic_font      IosevkaTermNF-Medium
bold_italic_font IosevkaTermNF-Bold

# font_family      IosevkaTerm Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

# For larger display
# font_family      Geist Mono Regular
# bold_font        Geist Mono Semibold
# italic_font      Geist Mono Regular
# bold_italic_font Geist Mono Semibold

# For Laptop display
# font_size	11.7

# For Laptop display
font_size	12.6

# For larger display
# font_size	9.4

# For larger display
# font_size	10.8

# For larger display
# font_size	10

# For Laptop display
adjust_line_height    139%
# adjust_line_height    120%
# adjust_column_width   94%
# adjust_column_width   98%
# adjust_column_width   105%
adjust_column_width   108%

# For larger display
# adjust_line_height    115%
# adjust_column_width   95%

# WINDOW
remember_window_size  yes
initial_window_width  1440
initial_window_height 1080
window_padding_width 16 12 16 12
hide_window_decorations yes
tab_fade 0 0 0 0
background_opacity 0.89
dynamic_background_opacity yes

# TAB BAR
active_tab_font_style normal
inactive_tab_font_style normal
tab_bar_margin_width 8.0
tab_bar_margin_height 10.0 0.0
tab_bar_style custom
tab_bar_align center
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_separator " "
tab_title_template "{fmt.bg.default}{fmt.fg._d65d0e}  {index} 󰓩  {title}{bell_symbol}{activity_symbol}  {fmt.fg.default}"
active_tab_title_template "{fmt.bg.default}{fmt.fg._3c3836}{fmt.bg._3c3836}{fmt.fg._d79921} {index} 󰓩  {title}{bell_symbol}{activity_symbol} {fmt.bg.default}{fmt.fg._3c3836}{fmt.bg.default}{fmt.fg.default}"
tab_bar_background #1D2021
active_tab_foreground #EBDBB2
inactive_tab_background #3C3836

# SYMBOLS

# - Use additional nerd symbols
# See https://github.com/be5invis/Iosevka/issues/248
# See https://github.com/ryanoasis/nerd-fonts/wiki/Glyph-Sets-and-Code-Points

# Seti-UI + Custom
symbol_map U+E5FA-U+E6AC Symbols Nerd Font

# Devicons
symbol_map U+E700-U+E7C5 Symbols Nerd Font

# Font Awesome
symbol_map U+F000-U+F2E0 Symbols Nerd Font

# Font Awesome Extension
symbol_map U+E200-U+E2A9 Symbols Nerd Font

# Material Design Icons
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font

# Weather
symbol_map U+E300-U+E3E3 Symbols Nerd Font

# Octicons
symbol_map U+F400-U+F532,U+2665,U+26A1 Symbols Nerd Font

# Powerline Symbols
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 Symbols Nerd Font

# Powerline Extra Symbols
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4 Symbols Nerd Font

# IEC Power Symbols
symbol_map U+23FB-U+23FE,U+2B58 Symbols Nerd Font

# Font Logos
symbol_map U+F300-U+F32F Symbols Nerd Font

# Pomicons
symbol_map U+E000-U+E00A Symbols Nerd Font

# Codicons
symbol_map U+EA60-U+EBEB Symbols Nerd Font

# Additional sets
symbol_map U+E276C-U+E2771 Symbols Nerd Font # Heavy Angle Brackets
symbol_map U+2500-U+259F Symbols Nerd Font # Box Drawing

# Some symbols not covered by Symbols Nerd Font
# nonicons contains icons in the range: U+F101-U+F27D
# U+F167 is HTML logo, but YouTube logo in Symbols Nerd Font
symbol_map U+F102,U+F116-U+F118,U+F12F,U+F13E,U+F1AF,U+F1BF,U+F1CF,U+F1FF,U+F20F,U+F21F-U+F220,U+F22E-U+F22F,U+F23F,U+F24F,U+F25F nonicons

